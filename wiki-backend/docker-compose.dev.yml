version: '3.8'

services:
  
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: streaq run app.tasks.worker:worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      typesense:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://wiki_user:wiki_password@postgres:5432/wiki_db
      DATABASE_URL_SYNC: postgresql://wiki_user:wiki_password@postgres:5432/wiki_db
      REDIS_URL: redis://redis:6379/0
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: xyz123
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"] # заглушка, можно реализовать запрос к внутреннему HTTP-эндоинту воркера
      interval: 30s
      timeout: 10s
      retries: 3
  neunets:
    build: ../neunet_service
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 2s
      retries: 3
  typesense:
    image: typesense/typesense:30.1
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz123}  # задайте ключ в .env
      - TYPESENSE_ENABLE_CORS=true
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 10s
      retries: 5
  postgres:
    hostname: postgres
    image: postgres:15
    build:
      context: scripts

    environment:
      POSTGRES_DB: wiki_db
      POSTGRES_USER: wiki_user
      POSTGRES_PASSWORD: wiki_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_user -d wiki_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"  # API порт
      - "9001:9001"  # Console порт
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Настройки для автоматического создания bucket
      MINIO_DEFAULT_BUCKETS: "media-files"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/media-files --ignore-existing;
      /usr/bin/mc policy set public myminio/media-files;
      echo 'MinIO setup completed';
      "

volumes:
  postgres_data:
  minio_data:
  typesense_data: