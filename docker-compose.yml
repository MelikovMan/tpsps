version: '3.8'

services:
  neunets:
    build: ./neunet_service
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 2s
      retries: 3
    networks:
      - wiki-network
  typesense:
    image: typesense/typesense:30.1
    ports:
      - "8108:8108"
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-xyz123}  
      - TYPESENSE_ENABLE_CORS=true
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 15s
    networks:
      - wiki-network

  typesense-indexer:
    build:
      context: ./wiki-backend
      dockerfile: Dockerfile.indexer
    command: python typesense_index_creation.py
    profiles: [indexer]
    environment:
      DATABASE_URL: postgresql+asyncpg://wiki_user:wiki_password@postgres:5432/wiki_db
      DATABASE_URL_SYNC: postgresql://wiki_user:wiki_password@postgres:5432/wiki_db
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz123}
      TYPESENSE_EMBEDDING_MODEL: ${TYPESENSE_EMBEDDING_MODEL:-ts/multilingual-e5-base}
      SECRET_KEY: ${SECRET_KEY:-sluggy}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wiki-network
    restart: "no"

  frontend:
    build: 
      context: ./frontend  
    ports:
      - "80:3000"
    environment:
    - NEXT_PUBLIC_API_URL=http://backend:8000
    - BUILD_STRATEGY=isr
    depends_on:
      - backend
    networks:
      - wiki-network

  worker:
    build:
      context: ./wiki-backend
      dockerfile: Dockerfile.worker
    command: streaq run app.tasks.worker:worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://wiki_user:wiki_password@postgres:5432/wiki_db
      - DATABASE_URL_SYNC=postgresql://wiki_user:wiki_password@postgres:5432/wiki_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000"]
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=xyz123
      - SEARCH_ENGINE=typesense
      - VANDALISM_CHECK_URL=http://neunets:8010/models/vandalism/"
      - SECRET_KEY=${SECRET_KEY:-fg}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"] # заглушка, можно реализовать запрос к внутреннему HTTP-эндоинту воркера
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
    - backup_temp:/tmp/wiki_backups
    networks:
      - wiki-network
  backend:
    build: ./wiki-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://wiki_user:wiki_password@postgres:5432/wiki_db
      - DATABASE_URL_SYNC=postgresql://wiki_user:wiki_password@postgres:5432/wiki_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - CORS_ORIGINS=["http://localhost:3000", "http://127.0.0.1:3000"]
      - TYPESENSE_HOST=typesense
      - TYPESENSE_PORT=8108
      - TYPESENSE_API_KEY=xyz123
      - SEARCH_ENGINE=typesense
      - VANDALISM_CHECK_URL=http://neunets:8010/models/vandalism/"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - wiki-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: wiki_db
      POSTGRES_USER: wiki_user
      POSTGRES_PASSWORD: wiki_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./wiki-backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiki_user -d wiki_db"]
    networks:
      - wiki-network

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - wiki-network

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"  # API порт
      - "9001:9001"  # Console порт
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Настройки для автоматического создания bucket
      MINIO_DEFAULT_BUCKETS: "media-files"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - wiki-network
  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/media-files --ignore-existing;
      /usr/bin/mc policy set public myminio/media-files;
      echo 'MinIO setup completed';
      "
    networks:
      - wiki-network

volumes:
  postgres_data:
  minio_data:
  typesense_data:
  backup_temp:

networks:
  wiki-network:
    driver: bridge